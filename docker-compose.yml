services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sm
      POSTGRES_USER: sm
      POSTGRES_PASSWORD: sm
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm -d sm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sm:sm@postgres:5432/sm
      REDIS_URL: redis://redis:6379/0
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sm:sm@postgres:5432/sm
      REDIS_URL: redis://redis:6379/0
    command: arq app.workers.settings.WorkerSettings
    depends_on: [api]

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
